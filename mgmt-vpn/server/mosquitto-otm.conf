# MQTT-Proxy fuer die OTM-Empfaenger: lauscht nur im Management-Netz und
# lokal, reicht its/# per TLS an cits1.opentrafficmap.org weiter. Die
# Statistik (otm-stats) liest lokal mit.
per_listener_settings true

listener 1883 10.66.0.1
allow_anonymous true

listener 1883 127.0.0.1
allow_anonymous true

connection otm-cits1
address cits1.opentrafficmap.org:8883
bridge_capath /etc/ssl/certs
bridge_protocol_version mqttv311
remote_clientid otm-wgiot-bridge
try_private false
notifications false
cleansession true
restart_timeout 10 120
keepalive_interval 60
topic its/# out 0
max_queued_messages 100000
queue_qos0_messages true
