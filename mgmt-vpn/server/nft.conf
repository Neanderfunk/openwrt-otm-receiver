# OTM-Management-Netz abschotten. Eigene Tabelle mit Prioritaet vor den
# bestehenden Regeln: ein drop hier gilt, egal was andere Tabellen erlauben.
table inet otm_mgmt
delete table inet otm_mgmt
table inet otm_mgmt {
	chain input {
		type filter hook input priority filter - 1; policy accept;
		iifname "br-otm" ct state established,related accept
		iifname "br-otm" udp dport { 53, 67 } accept
		iifname "br-otm" tcp dport 53 accept
		iifname "br-otm" icmp type echo-request accept
		iifname "br-otm" drop
	}
	chain forward {
		type filter hook forward priority filter - 1; policy accept;
		iifname "br-otm" drop
		oifname "br-otm" drop
	}
}
