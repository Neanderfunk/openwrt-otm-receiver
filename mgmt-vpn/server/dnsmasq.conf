# DHCP und DNS nur fuer das OTM-Management-Netz (br-otm).
# Kein Router und kein DNS-Server an die Geraete: deren Standardroute
# bleibt am lokalen Uplink (Broker-Verkehr nicht durchs VPN).
interface=br-otm
bind-dynamic
no-resolv
no-hosts
domain=otm
local=/otm/
dhcp-range=10.66.0.10,10.66.3.250,255.255.252.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq-otm.leases
pid-file=/run/dnsmasq-otm.pid
