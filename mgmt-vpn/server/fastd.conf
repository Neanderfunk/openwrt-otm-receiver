# OTM-Management-VPN (Gegenstelle wgiot6.ffdus.de)
# Jedes OTM-Geraet verbindet sich mit eigenem Schluessel; angenommen wird
# jeder ausser der Sperrliste (on verify), es sei denn, die Registrierung
# (nur-freigegebene) ist eingeschaltet. Ein tap je Geraet
# (multitap), alle isoliert in br-otm: Geraete sehen nur die Gegenstelle.
log to syslog level info;
mode multitap;
method "salsa2012+umac";
bind any:10001;
include "secret.conf";
mtu 1312;
on up "/etc/fastd/otm/peer-up.sh";
on establish async "/etc/fastd/otm/peer-log.sh";
# Sperr- und Freigabeliste (Pflege: otm-fastd); ohne Eintraege darf jeder.
on verify "/etc/fastd/otm/verify.sh";
# Statussocket fuer otm-fastd (Zuordnung Schluessel - tap - Knoten)
status socket "/run/fastd-otm.sock";
